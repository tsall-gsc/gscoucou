<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<title>School Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<!-- Styles: the order matters, later files override earlier ones. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/print.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<!-- Login screen -->
<section id="login" hidden>
  <form class="login-box" data-form="login">
    <h1>School Manager</h1>
    <p class="hint">Sign in with the account your administrator created for you.</p>
    <label>Email <input type="email" name="email" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="login-error" class="hint" role="alert" style="color: var(--danger)"></p>
  </form>
</section>

<!-- Main app -->
<div id="app" hidden>
  <aside>
    <div class="brand">School Manager</div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="who">
      <span id="who-name"></span>
      <span id="who-role" class="role"></span>
      <button class="btn small" data-action="logout" type="button">Sign out</button>
    </div>
  </aside>
  <main>
    <div id="msg" role="status" hidden></div>
    <div id="view"></div>
  </main>
</div>

<!-- Setup notice, shown only until the two settings below are filled in -->
<section id="setup" hidden style="padding:2rem;max-width:40rem">
  <h2>One setup step left</h2>
  <p class="lead" style="margin-top:.75rem">Open <code>config.js</code> next to this page and paste in the Project URL and the public key from your Supabase project (Project Settings → API).</p>
</section>

<!-- The Supabase library (loaded from a CDN) and your connection settings, then the app itself. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
