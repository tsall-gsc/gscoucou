<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f9;
    --card: #ffffff;
    --ink: #1b2433;
    --muted: #5c6678;
    --line: #d9dee6;
    --accent: #0f6e6e;
    --accent-ink: #ffffff;
    --danger: #b3402a;
    --ok-bg: #e4f2ee;
    --err-bg: #f8e6e1;
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  * { box-sizing: border-box; }
  body { margin: 0; line-height: 1.5; }
  [hidden] { display: none !important; }
  h1, h2 { line-height: 1.2; margin: 0; }
  h2 { font-size: 1.5rem; }
  p { margin: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Buttons and fields */
  .btn { border: 1px solid var(--line); background: var(--card); padding: .45rem .9rem; border-radius: 6px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: .25rem .6rem; font-size: .9rem; }
  label { display: grid; gap: .25rem; font-size: .95rem; color: var(--muted); }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=tel], input[type=search], select {
    border: 1px solid var(--line); border-radius: 6px; padding: .5rem .6rem; background: #fff; color: var(--ink); width: 100%; font: inherit;
  }
  label.check { display: flex; align-items: center; gap: .5rem; color: var(--ink); }
  label.check input { width: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; flex: 2 1 14rem; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; background: var(--ok-bg); color: var(--ink); border-radius: 99px; padding: .15rem .3rem .15rem .75rem; }
  .chip-x { border: 0; background: none; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: .1rem .4rem; color: var(--danger); border-radius: 99px; }
  .chip-x:hover { background: rgba(179, 64, 42, .12); }
  .pick { display: flex; gap: .5rem; flex: 1 1 14rem; }
  .pick select { flex: 1; }
  .year-pick { max-width: 16rem; }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
  .login-box { width: min(26rem, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2rem; display: grid; gap: 1.1rem; }
  .login-box h1 { font-size: 1.6rem; }
  .login-box .hint { color: var(--muted); font-size: .95rem; }

  /* App shell */
  #app { display: grid; grid-template-columns: 15rem 1fr; min-height: 100vh; }
  aside { background: var(--ink); color: #e8ecf3; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
  aside .brand { font-weight: 700; font-size: 1.15rem; padding: 0 .5rem; }
  nav { display: grid; gap: .15rem; }
  nav button { text-align: left; background: none; border: 0; color: inherit; padding: .55rem .6rem; border-radius: 6px; cursor: pointer; }
  nav button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
  nav button[aria-current=page] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  nav button:disabled { opacity: .45; cursor: default; }
  nav .group { font-size: .85rem; color: #aab4c5; padding: .6rem .6rem .2rem; }
  .who { margin-top: auto; font-size: .9rem; display: grid; gap: .4rem; padding: 0 .5rem; }
  .who .role { color: #aab4c5; }
  .who .btn { background: transparent; color: #e8ecf3; border-color: #4a566b; }
  main { padding: 2rem clamp(1rem, 4vw, 3rem); max-width: 60rem; width: 100%; display: grid; gap: 1.25rem; align-content: start; }
  .lead { color: var(--muted); max-width: 60ch; }

  /* Messages */
  #msg { padding: .65rem .9rem; border-radius: 6px; background: var(--ok-bg); }
  #msg.error { background: var(--err-bg); }

  /* Add form and rows */
  .add { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; }
  .add label { flex: 1 1 10rem; }
  .rows { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .rows li { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: .75rem 1rem; border-top: 1px solid var(--line); }
  .rows li:first-child { border-top: 0; }
  .rows .grow { flex: 1 1 12rem; font-weight: 700; }
  .rows .meta { color: var(--muted); font-size: .95rem; }
  .rows form { display: flex; flex-wrap: wrap; gap: .6rem; align-items: end; width: 100%; }
  .rows form label { flex: 1 1 8rem; }
  .actions { display: flex; gap: .4rem; margin-left: auto; }
  .badge { background: var(--ok-bg); color: var(--accent); border-radius: 99px; padding: .1rem .6rem; font-size: .85rem; font-weight: 700; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 1.5rem; color: var(--muted); }

  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; }
    aside { flex-direction: row; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .75rem; }
    nav { display: flex; flex-wrap: wrap; }
    nav .group { display: none; }
    .who { margin: 0 0 0 auto; }
  }
</style>
</head>
<body>

<!-- Login screen -->
<section id="login" hidden>
  <form class="login-box" data-form="login">
    <h1>School Manager</h1>
    <p class="hint">Sign in with the account your administrator created for you.</p>
    <label>Email <input type="email" name="email" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="login-error" class="hint" role="alert" style="color: var(--danger)"></p>
  </form>
</section>

<!-- Main app -->
<div id="app" hidden>
  <aside>
    <div class="brand">School Manager</div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="who">
      <span id="who-name"></span>
      <span id="who-role" class="role"></span>
      <button class="btn small" data-action="logout" type="button">Sign out</button>
    </div>
  </aside>
  <main>
    <div id="msg" role="status" hidden></div>
    <div id="view"></div>
  </main>
</div>

<!-- Setup notice, shown only until the two settings below are filled in -->
<section id="setup" hidden style="padding:2rem;max-width:40rem">
  <h2>One setup step left</h2>
  <p class="lead" style="margin-top:.75rem">Open <code>config.js</code> next to this page and paste in the Project URL and the public key from your Supabase project (Project Settings → API).</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const tname = t => [t?.first_name, t?.last_name].filter(Boolean).join(' ');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ROLE_LABEL = { super_admin: 'Super admin', admin: 'Admin', user: 'Data entry' };

const state = { user: null, profile: null, view: 'grades', editing: null, assignYear: null, stuGrade: '', stuQuery: '', yearId: null };
const isAdmin = () => ['admin', 'super_admin'].includes(state.profile?.role);
const isSuper = () => state.profile?.role === 'super_admin';

let db;
let msgTimer;

function notify(text, isError = false) {
  const el = $('#msg');
  el.textContent = text;
  el.className = isError ? 'error' : '';
  el.hidden = false;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.hidden = true; }, 6000);
}

function friendly(error) {
  if (error.code === '23505') return 'That name already exists. Choose a different one.';
  if (error.code === '23503') return 'This item is still in use (by students, teachers or payments), so it can’t be deleted.';
  if (error.code === '42501') return 'Your role doesn’t allow this action.';
  return error.message || 'Something went wrong. Try again.';
}

/* ---------- Sections ---------- */
const SECTIONS = [
  { id: 'years',  label: 'School years', render: renderYears },
  { id: 'grades', label: 'Grades',       render: renderGrades },
  { id: 'teachers', label: 'Teachers',   render: renderTeachers },
  { id: 'assign', label: 'Assign teachers', render: renderAssign },
  { id: 'students', label: 'Students', render: renderStudents },
];
const COMING = ['Expenses', 'Fees'];

function renderNav() {
  $('#nav').innerHTML =
    '<span class="group">Set up</span>' +
    SECTIONS.map(s => `<button type="button" data-action="go" data-id="${s.id}" ${state.view === s.id ? 'aria-current="page"' : ''}>${esc(s.label)}</button>`).join('') +
    '<span class="group">Coming next</span>' +
    COMING.map(c => `<button type="button" disabled>${esc(c)}</button>`).join('');
}

async function show(id) {
  state.view = id;
  state.editing = null;
  renderNav();
  await SECTIONS.find(s => s.id === id).render();
}

/* ---------- Grades ---------- */
async function renderGrades() {
  const { data, error } = await db.from('grades').select('*').order('sort_order').order('name');
  if (error) return notify(friendly(error), true);

  const rows = data.map(g => state.editing === 'g' + g.id
    ? `<li><form data-form="grade-edit" data-id="${g.id}">
         <label>Name <input type="text" name="name" value="${esc(g.name)}" required></label>
         <label>Order <input type="number" name="sort_order" value="${g.sort_order}"></label>
         <button class="btn primary small" type="submit">Save changes</button>
         <button class="btn small" type="button" data-action="cancel">Cancel</button>
       </form></li>`
    : `<li><span class="grow">${esc(g.name)}</span><span class="meta">Order ${g.sort_order}</span>
         <span class="actions">
           ${isAdmin() ? `<button class="btn small" type="button" data-action="edit" data-key="g${g.id}">Edit</button>` : ''}
           ${isSuper() ? `<button class="btn small danger" type="button" data-action="del-grade" data-id="${g.id}" data-name="${esc(g.name)}">Delete</button>` : ''}
         </span></li>`).join('');

  $('#view').innerHTML = `
    <div style="display:grid;gap:1.25rem">
      <h2>Grades</h2>
      <p class="lead">The classes of your school. Students and teachers are linked to these, so add them first.</p>
      ${isAdmin() ? `<form class="add" data-form="grade-add">
          <label>Grade name <input type="text" name="name" placeholder="e.g. Grade 1" required></label>
          <label>Order <input type="number" name="sort_order" value="${data.length + 1}"></label>
          <button class="btn primary" type="submit">Add grade</button>
        </form>` : ''}
      ${data.length ? `<ul class="rows">${rows}</ul>`
        : `<div class="empty">No grades yet. ${isAdmin() ? 'Add your first grade above.' : 'An admin needs to add them.'}</div>`}
    </div>`;
}

/* ---------- School years ---------- */
async function renderYears() {
  const { data, error } = await db.from('school_years').select('*').order('label', { ascending: false });
  if (error) return notify(friendly(error), true);

  const rows = data.map(y => state.editing === 'y' + y.id
    ? `<li><form data-form="year-edit" data-id="${y.id}">
         <label>Label <input type="text" name="label" value="${esc(y.label)}" required></label>
         <label>Starts <input type="date" name="start_date" value="${y.start_date ?? ''}"></label>
         <label>Ends <input type="date" name="end_date" value="${y.end_date ?? ''}"></label>
         <button class="btn primary small" type="submit">Save changes</button>
         <button class="btn small" type="button" data-action="cancel">Cancel</button>
       </form></li>`
    : `<li><span class="grow">${esc(y.label)}</span>
         ${y.is_current ? '<span class="badge">Current</span>' : ''}
         <span class="meta">${y.start_date ? esc(y.start_date) : '…'} to ${y.end_date ? esc(y.end_date) : '…'}</span>
         <span class="actions">
           ${isAdmin() && !y.is_current ? `<button class="btn small" type="button" data-action="make-current" data-id="${y.id}">Make current</button>` : ''}
           ${isAdmin() ? `<button class="btn small" type="button" data-action="edit" data-key="y${y.id}">Edit</button>` : ''}
           ${isSuper() ? `<button class="btn small danger" type="button" data-action="del-year" data-id="${y.id}" data-name="${esc(y.label)}">Delete</button>` : ''}
         </span></li>`).join('');

  $('#view').innerHTML = `
    <div style="display:grid;gap:1.25rem">
      <h2>School years</h2>
      <p class="lead">Fees, enrollments and teacher assignments are tracked per school year. Mark one year as current.</p>
      ${isAdmin() ? `<form class="add" data-form="year-add">
          <label>Label <input type="text" name="label" placeholder="e.g. 2026-2027" required></label>
          <label>Starts <input type="date" name="start_date"></label>
          <label>Ends <input type="date" name="end_date"></label>
          <button class="btn primary" type="submit">Add school year</button>
        </form>` : ''}
      ${data.length ? `<ul class="rows">${rows}</ul>`
        : `<div class="empty">No school years yet. ${isAdmin() ? 'Add the first one above.' : 'An admin needs to add one.'}</div>`}
    </div>`;
}

/* ---------- Teachers ---------- */
async function renderTeachers() {
  const [tRes, yRes] = await Promise.all([
    db.from('teachers').select('*, teacher_assignments(school_year_id, grades(name, sort_order))').order('last_name').order('first_name'),
    db.from('school_years').select('id, label').eq('is_current', true).maybeSingle(),
  ]);
  if (tRes.error) return notify(friendly(tRes.error), true);
  const yearId = yRes.data?.id;
  const classesOf = t => (t.teacher_assignments || [])
    .filter(a => a.school_year_id === yearId && a.grades)
    .sort((a, b) => a.grades.sort_order - b.grades.sort_order)
    .map(a => a.grades.name).join(', ');

  const rows = tRes.data.map(t => {
    if (state.editing === 't' + t.id) {
      return `<li><form data-form="teacher-edit" data-id="${t.id}">
        <label>First name <input type="text" name="first_name" value="${esc(t.first_name)}" required></label>
        <label>Last name <input type="text" name="last_name" value="${esc(t.last_name)}" required></label>
        <label>Phone <input type="tel" name="phone" value="${esc(t.phone)}"></label>
        <label>Email <input type="email" name="email" value="${esc(t.email)}"></label>
        <label class="check"><input type="checkbox" name="active" ${t.active ? 'checked' : ''}> Currently teaching</label>
        <button class="btn primary small" type="submit">Save changes</button>
        <button class="btn small" type="button" data-action="cancel">Cancel</button>
      </form></li>`;
    }
    const classes = classesOf(t);
    return `<li><span class="grow">${esc(tname(t))}</span>
      ${t.active ? '' : '<span class="meta">Not teaching</span>'}
      <span class="meta">${classes ? 'Class ' + esc(classes) : 'No class this year'}</span>
      <span class="meta">${esc(t.phone || '')}${t.email ? ' · ' + esc(t.email) : ''}</span>
      <span class="actions">
        ${isAdmin() ? `<button class="btn small" type="button" data-action="edit" data-key="t${t.id}">Edit</button>` : ''}
        ${isSuper() ? `<button class="btn small danger" type="button" data-action="del-teacher" data-id="${t.id}" data-name="${esc(tname(t))}">Delete</button>` : ''}
      </span></li>`;
  }).join('');

  $('#view').innerHTML = `
    <div style="display:grid;gap:1.25rem">
      <h2>Teachers</h2>
      <p class="lead">Everyone who teaches at the school. The class shown is for the current school year. Use Assign teachers to change it.</p>
      ${isAdmin() ? `<form class="add" data-form="teacher-add">
          <label>First name <input type="text" name="first_name" required></label>
          <label>Last name <input type="text" name="last_name" required></label>
          <label>Phone <input type="tel" name="phone"></label>
          <label>Email <input type="email" name="email"></label>
          <button class="btn primary" type="submit">Add teacher</button>
        </form>` : ''}
      ${tRes.data.length ? `<ul class="rows">${rows}</ul>`
        : `<div class="empty">No teachers yet. ${isAdmin() ? 'Add the first one above.' : 'An admin needs to add them.'}</div>`}
    </div>`;
}

/* ---------- Assign teachers to grades ---------- */
async function renderAssign() {
  const [yRes, gRes, tRes] = await Promise.all([
    db.from('school_years').select('id, label, is_current').order('label', { ascending: false }),
    db.from('grades').select('id, name').order('sort_order').order('name'),
    db.from('teachers').select('id, first_name, last_name').eq('active', true).order('last_name').order('first_name'),
  ]);
  const err = yRes.error || gRes.error || tRes.error;
  if (err) return notify(friendly(err), true);

  const years = yRes.data;
  if (!years.length) {
    $('#view').innerHTML = `<div style="display:grid;gap:1.25rem"><h2>Assign teachers</h2>
      <div class="empty">Add a school year first, in the School years section.</div></div>`;
    return;
  }
  const yearId = years.find(y => String(y.id) === String(state.assignYear))?.id
    ?? years.find(y => y.is_current)?.id ?? years[0].id;
  state.assignYear = yearId;

  const aRes = await db.from('teacher_assignments')
    .select('id, grade_id, teacher_id, teachers(first_name, last_name)').eq('school_year_id', yearId);
  if (aRes.error) return notify(friendly(aRes.error), true);

  const byGrade = {};
  aRes.data.forEach(a => (byGrade[a.grade_id] ||= []).push(a));

  const rows = gRes.data.map(g => {
    const list = byGrade[g.id] || [];
    const taken = new Set(list.map(a => a.teacher_id));
    const options = tRes.data.filter(t => !taken.has(t.id));
    const chips = list.map(a => `<span class="chip">${esc(tname(a.teachers))}${isAdmin()
      ? `<button type="button" class="chip-x" data-action="unassign" data-id="${a.id}" aria-label="Remove ${esc(tname(a.teachers))} from ${esc(g.name)}">×</button>` : ''}</span>`).join('');
    const picker = isAdmin() && options.length
      ? `<form class="pick" data-form="assign-add">
           <input type="hidden" name="grade_id" value="${g.id}">
           <input type="hidden" name="year_id" value="${yearId}">
           <select name="teacher_id" required aria-label="Add a teacher to ${esc(g.name)}">
             <option value="">Add a teacher…</option>
             ${options.map(t => `<option value="${t.id}">${esc(tname(t))}</option>`).join('')}
           </select>
           <button class="btn small primary" type="submit">Assign</button>
         </form>` : '';
    return `<li><span class="grow">${esc(g.name)}</span>
      <span class="chips">${chips || '<span class="meta">No teacher yet</span>'}</span>${picker}</li>`;
  }).join('');

  $('#view').innerHTML = `
    <div style="display:grid;gap:1.25rem">
      <h2>Assign teachers</h2>
      <p class="lead">Choose which teacher teaches each class in a given school year. A class can have more than one teacher.</p>
      <label class="year-pick">School year
        <select data-change="year">
          ${years.map(y => `<option value="${y.id}" ${y.id === yearId ? 'selected' : ''}>${esc(y.label)}${y.is_current ? ' (current)' : ''}</option>`).join('')}
        </select>
      </label>
      ${gRes.data.length ? `<ul class="rows">${rows}</ul>`
        : `<div class="empty">No grades yet. Add them in the Grades section first.</div>`}
    </div>`;
}

/* ---------- Students ---------- */
async function renderStudents() {
  const [sRes, yRes, gRes] = await Promise.all([
    db.from('students')
      .select('*, enrollments(id, school_year_id, grade_id, grades(name, sort_order))')
      .order('last_name').order('first_name').limit(5000),
    db.from('school_years').select('id, label').eq('is_current', true).maybeSingle(),
    db.from('grades').select('id, name').order('sort_order').order('name'),
  ]);
  const err = sRes.error || gRes.error;
  if (err) return notify(friendly(err), true);

  const yearId = yRes.data?.id ?? null;
  state.yearId = yearId;
  const grades = gRes.data;
  const enrOf = s => (s.enrollments || []).find(e => e.school_year_id === yearId);
  const gradeOptions = selected => '<option value="">No grade</option>' +
    grades.map(g => `<option value="${g.id}" ${String(g.id) === String(selected) ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
  const gradeField = selected => yearId
    ? `<label>Grade <select name="grade_id">${gradeOptions(selected)}</select></label>` : '';

  const rows = sRes.data.map(s => {
    const e = enrOf(s);
    const gid = e ? String(e.grade_id) : '';
    const gname = e?.grades?.name || '';
    if (state.editing === 's' + s.id) {
      return `<li><form data-form="student-edit" data-id="${s.id}">
        <label>First name <input type="text" name="first_name" value="${esc(s.first_name)}" required></label>
        <label>Last name <input type="text" name="last_name" value="${esc(s.last_name)}" required></label>
        ${gradeField(gid)}
        <label>Parent or guardian <input type="text" name="guardian_name" value="${esc(s.guardian_name)}"></label>
        <label>Parent phone <input type="tel" name="guardian_phone" value="${esc(s.guardian_phone)}"></label>
        <label>Birth date <input type="date" name="birth_date" value="${s.birth_date ?? ''}"></label>
        <label>Notes <input type="text" name="notes" value="${esc(s.notes)}"></label>
        <label class="check"><input type="checkbox" name="active" ${s.active ? 'checked' : ''}> Currently enrolled</label>
        <button class="btn primary small" type="submit">Save changes</button>
        <button class="btn small" type="button" data-action="cancel">Cancel</button>
      </form></li>`;
    }
    const q = [s.first_name, s.last_name, s.guardian_name, s.guardian_phone, gname].filter(Boolean).join(' ').toLowerCase();
    const contact = [s.guardian_name, s.guardian_phone].filter(Boolean).map(esc).join(' · ');
    return `<li data-grade="${gid}" data-q="${esc(q)}">
      <span class="grow">${esc(s.last_name)} ${esc(s.first_name)}</span>
      ${gname ? `<span class="badge">${esc(gname)}</span>` : '<span class="meta">No grade</span>'}
      ${s.active ? '' : '<span class="meta">Not enrolled</span>'}
      <span class="meta">${contact}</span>
      <span class="actions">
        <button class="btn small" type="button" data-action="edit" data-key="s${s.id}">Edit</button>
        ${isAdmin() ? `<button class="btn small danger" type="button" data-action="del-student" data-id="${s.id}" data-name="${esc(s.first_name + ' ' + s.last_name)}">Delete</button>` : ''}
      </span></li>`;
  }).join('');

  const filterBar = sRes.data.length ? `
    <div class="add">
      <label>Search <input type="search" id="stu-q" placeholder="Name, parent or phone" value="${esc(state.stuQuery)}"></label>
      <label>Grade
        <select data-change="stu-filter">
          <option value="">All grades</option>
          ${grades.map(g => `<option value="${g.id}" ${String(g.id) === state.stuGrade ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
          <option value="none" ${state.stuGrade === 'none' ? 'selected' : ''}>No grade</option>
        </select>
      </label>
      <span class="meta" id="stu-count" role="status"></span>
    </div>` : '';

  $('#view').innerHTML = `
    <div style="display:grid;gap:1.25rem">
      <h2>Students</h2>
      <p class="lead">Every student with their grade for the current school year and their parent’s contact. Anyone with an account can add and edit students.</p>
      ${yearId ? '' : '<div class="empty">No school year is marked as current, so grades can’t be shown or set. Mark one in School years.</div>'}
      <form class="add" data-form="student-add">
        <label>First name <input type="text" name="first_name" required></label>
        <label>Last name <input type="text" name="last_name" required></label>
        ${gradeField('')}
        <label>Parent or guardian <input type="text" name="guardian_name"></label>
        <label>Parent phone <input type="tel" name="guardian_phone"></label>
        <button class="btn primary" type="submit">Add student</button>
      </form>
      ${filterBar}
      ${sRes.data.length ? `<ul class="rows" id="stu-list">${rows}</ul>`
        : '<div class="empty">No students yet. Add the first one above.</div>'}
    </div>`;
  applyStudentFilter();
}

function applyStudentFilter() {
  const g = state.stuGrade;
  const q = state.stuQuery.trim().toLowerCase();
  let shown = 0, total = 0;
  document.querySelectorAll('#stu-list li[data-q]').forEach(li => {
    total++;
    const okGrade = !g || (g === 'none' ? li.dataset.grade === '' : li.dataset.grade === g);
    const okText = !q || li.dataset.q.includes(q);
    li.hidden = !(okGrade && okText);
    if (!li.hidden) shown++;
  });
  const c = $('#stu-count');
  if (c) c.textContent = `${shown} of ${total} students`;
}

/* ---------- Form submissions ---------- */
const nullIfEmpty = v => (v === '' || v == null ? null : v);

const FORMS = {
  async login(f) {
    $('#login-error').textContent = '';
    const { error } = await db.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
    if (error) $('#login-error').textContent = 'Email or password is incorrect.';
  },
  async 'grade-add'(f) {
    const { error } = await db.from('grades').insert({ name: f.name.trim(), sort_order: Number(f.sort_order) || 0 });
    return done(error, 'Grade added.', renderGrades);
  },
  async 'grade-edit'(f, id) {
    const { error } = await db.from('grades').update({ name: f.name.trim(), sort_order: Number(f.sort_order) || 0 }).eq('id', id);
    state.editing = null;
    return done(error, 'Grade updated.', renderGrades);
  },
  async 'year-add'(f) {
    const { error } = await db.from('school_years').insert({ label: f.label.trim(), start_date: nullIfEmpty(f.start_date), end_date: nullIfEmpty(f.end_date) });
    return done(error, 'School year added.', renderYears);
  },
  async 'year-edit'(f, id) {
    const { error } = await db.from('school_years').update({ label: f.label.trim(), start_date: nullIfEmpty(f.start_date), end_date: nullIfEmpty(f.end_date) }).eq('id', id);
    state.editing = null;
    return done(error, 'School year updated.', renderYears);
  },
  async 'teacher-add'(f) {
    const { error } = await db.from('teachers').insert({
      first_name: f.first_name.trim(), last_name: f.last_name.trim(), phone: nullIfEmpty(f.phone.trim()), email: nullIfEmpty(f.email.trim()),
    });
    return done(error, 'Teacher added.', renderTeachers);
  },
  async 'teacher-edit'(f, id) {
    const { error } = await db.from('teachers').update({
      first_name: f.first_name.trim(), last_name: f.last_name.trim(), phone: nullIfEmpty(f.phone.trim()), email: nullIfEmpty(f.email.trim()),
      active: f.active === 'on',
    }).eq('id', id);
    state.editing = null;
    return done(error, 'Teacher updated.', renderTeachers);
  },
  async 'assign-add'(f) {
    const { error } = await db.from('teacher_assignments').insert({
      teacher_id: Number(f.teacher_id), grade_id: Number(f.grade_id), school_year_id: Number(f.year_id),
    });
    return done(error, 'Teacher assigned.', renderAssign);
  },
  async 'student-add'(f) {
    const { data, error } = await db.from('students').insert({
      first_name: f.first_name.trim(), last_name: f.last_name.trim(),
      guardian_name: nullIfEmpty((f.guardian_name || '').trim()),
      guardian_phone: nullIfEmpty((f.guardian_phone || '').trim()),
    }).select('id').single();
    if (error) return notify(friendly(error), true);
    if (f.grade_id && state.yearId) {
      const enr = await db.from('enrollments').insert({
        student_id: data.id, school_year_id: state.yearId, grade_id: Number(f.grade_id),
      });
      if (enr.error) {
        await renderStudents();
        return notify('Student added, but the grade could not be set: ' + friendly(enr.error), true);
      }
    }
    return done(null, 'Student added.', renderStudents);
  },
  async 'student-edit'(f, id) {
    const { error } = await db.from('students').update({
      first_name: f.first_name.trim(), last_name: f.last_name.trim(),
      guardian_name: nullIfEmpty((f.guardian_name || '').trim()),
      guardian_phone: nullIfEmpty((f.guardian_phone || '').trim()),
      birth_date: nullIfEmpty(f.birth_date),
      notes: nullIfEmpty((f.notes || '').trim()),
      active: f.active === 'on',
    }).eq('id', id);
    if (error) return notify(friendly(error), true);
    if (f.grade_id && state.yearId) {
      const enr = await db.from('enrollments').upsert(
        { student_id: Number(id), school_year_id: state.yearId, grade_id: Number(f.grade_id) },
        { onConflict: 'student_id,school_year_id' });
      if (enr.error) return notify('Saved, but the grade could not be changed: ' + friendly(enr.error), true);
    }
    state.editing = null;
    return done(null, 'Student updated.', renderStudents);
  },
};

async function done(error, okText, rerender) {
  if (error) { notify(friendly(error), true); return; }
  notify(okText);
  await rerender();
}

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const handler = FORMS[form.dataset.form];
  if (handler) await handler(Object.fromEntries(new FormData(form)), form.dataset.id);
});

/* ---------- Button actions ---------- */
const ACTIONS = {
  go: b => show(b.dataset.id),
  edit: b => { state.editing = b.dataset.key; return SECTIONS.find(s => s.id === state.view).render(); },
  cancel: () => { state.editing = null; return SECTIONS.find(s => s.id === state.view).render(); },
  logout: () => db.auth.signOut(),
  async 'del-grade'(b) {
    if (!confirm(`Delete the grade “${b.dataset.name}”? This can’t be undone.`)) return;
    const { error } = await db.from('grades').delete().eq('id', b.dataset.id);
    return done(error, 'Grade deleted.', renderGrades);
  },
  async 'del-year'(b) {
    if (!confirm(`Delete the school year “${b.dataset.name}”? This can’t be undone.`)) return;
    const { error } = await db.from('school_years').delete().eq('id', b.dataset.id);
    return done(error, 'School year deleted.', renderYears);
  },
  async 'make-current'(b) {
    const off = await db.from('school_years').update({ is_current: false }).eq('is_current', true);
    if (off.error) return notify(friendly(off.error), true);
    const { error } = await db.from('school_years').update({ is_current: true }).eq('id', b.dataset.id);
    return done(error, 'Current school year updated.', renderYears);
  },
  async 'del-teacher'(b) {
    if (!confirm(`Delete ${b.dataset.name}? This also removes their class assignments and pay records, and can’t be undone. To keep the history, edit the teacher and untick “Currently teaching” instead.`)) return;
    const { error } = await db.from('teachers').delete().eq('id', b.dataset.id);
    return done(error, 'Teacher deleted.', renderTeachers);
  },
  async unassign(b) {
    const { error } = await db.from('teacher_assignments').delete().eq('id', b.dataset.id);
    return done(error, 'Teacher removed from the class.', renderAssign);
  },
  async 'del-student'(b) {
    if (!confirm(`Delete ${b.dataset.name}? This also removes their enrollments and fee payments, and can’t be undone. To keep the history, edit the student and untick “Currently enrolled” instead.`)) return;
    const { error } = await db.from('students').delete().eq('id', b.dataset.id);
    return done(error, 'Student deleted.', renderStudents);
  },
};

const CHANGES = {
  year: el => { state.assignYear = el.value; return renderAssign(); },
  'stu-filter': el => { state.stuGrade = el.value; applyStudentFilter(); },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (b && ACTIONS[b.dataset.action]) ACTIONS[b.dataset.action](b);
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el);
});

document.addEventListener('input', e => {
  if (e.target.id === 'stu-q') { state.stuQuery = e.target.value; applyStudentFilter(); }
});

/* ---------- Session handling ---------- */
async function enter(session) {
  if (!session) {
    state.user = null; state.profile = null;
    $('#app').hidden = true;
    $('#login').hidden = false;
    return;
  }
  state.user = session.user;
  const { data, error } = await db.from('profiles').select('full_name, role').eq('id', session.user.id).single();
  if (error || !data) {
    await db.auth.signOut();
    $('#login-error').textContent = 'Your account has no access yet. Ask the administrator.';
    return;
  }
  state.profile = data;
  $('#who-name').textContent = data.full_name || session.user.email;
  $('#who-role').textContent = ROLE_LABEL[data.role] || data.role;
  $('#login').hidden = true;
  $('#app').hidden = false;
  await show(state.view);
}

(async function boot() {
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined'
      || SUPABASE_URL.startsWith('PASTE') || SUPABASE_ANON_KEY.startsWith('PASTE')) {
    $('#setup').hidden = false;
    return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await db.auth.getSession();
  await enter(data.session);
  db.auth.onAuthStateChange((event, session) => {
    // Re-render only when someone signs in or out, not on routine token refreshes.
    if (event === 'SIGNED_OUT') enter(null);
    if (event === 'SIGNED_IN' && !state.user) enter(session);
  });
})();
</script>
